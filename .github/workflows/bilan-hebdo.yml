# Bilan de la semaine par e-mail, chaque dimanche vers 7 h (Paris).
# Deux horaires car GitHub compte en heure UTC : 5 h UTC = 7 h l'été, 6 h UTC = 7 h l'hiver.
# Le programme vérifie l'heure de Paris et n'envoie jamais deux fois le même bilan.
# Mise en place : tools/bilan/LISEZMOI.md
name: Bilan de la semaine

on:
  schedule:
    - cron: "0 5 * * 0"
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      essai:
        description: "Essai sans rien envoyer ? (oui / non)"
        required: true
        default: "oui"

permissions:
  contents: read

concurrency:
  group: bilan-hebdo
  cancel-in-progress: false

jobs:
  envoi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer
        working-directory: tools/bilan
        run: npm ci --no-audit --no-fund
      - name: Envoyer les bilans
        working-directory: tools/bilan
        run: node send.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          APP_URL: https://assalasarab.github.io/tracklift.github.io/
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.essai != 'non' && '1' || '' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
